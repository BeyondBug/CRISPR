services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose: ["8000"]
    volumes: ["./data:/app/data"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DB_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-3}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -hex 32)}
      - ACCESS_TOKEN_LIFETIME_MINUTES=${ACCESS_TOKEN_LIFETIME_MINUTES:-30}
      - ALLOW_PUBLIC_REPORTER_REGISTRATION=${ALLOW_PUBLIC_REPORTER_REGISTRATION:-false}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env}
      - ALLOW_INSECURE_CONNECTOR_HTTP=${ALLOW_INSECURE_CONNECTOR_HTTP:-false}
      - SECURITY_ADMIN_EMAIL=${SECURITY_ADMIN_EMAIL:?Set SECURITY_ADMIN_EMAIL in .env}
      - SECURITY_ADMIN_PASSWORD=${SECURITY_ADMIN_PASSWORD:?Set SECURITY_ADMIN_PASSWORD in .env}
      - SIH_EXECUTIVE_EMAIL=${SIH_EXECUTIVE_EMAIL:?Set SIH_EXECUTIVE_EMAIL in .env}
      - SIH_EXECUTIVE_PASSWORD=${SIH_EXECUTIVE_PASSWORD:?Set SIH_EXECUTIVE_PASSWORD in .env}
      - SIH_TECHNICAL_EMAIL=${SIH_TECHNICAL_EMAIL:?Set SIH_TECHNICAL_EMAIL in .env}
      - SIH_TECHNICAL_PASSWORD=${SIH_TECHNICAL_PASSWORD:?Set SIH_TECHNICAL_PASSWORD in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:3000,http://localhost:3000}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_MODEL=${LLM_MODEL:-inclusionai/ling-3.0-flash-sante:free}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - CRISPR_DATA_MODE=${CRISPR_DATA_MODE:-live}
      - DEMO_AUTO_SEED=${DEMO_AUTO_SEED:-false}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_USER_AGENT=${NVD_USER_AGENT:-CRISPR-risk-platform/1.0}
      - NVD_REQUEST_INTERVAL_SECONDS=${NVD_REQUEST_INTERVAL_SECONDS:-}
      - NEO4J_ENABLED=${NEO4J_ENABLED:-true}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  sih-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_API_MODE: live
        VITE_SIH_WORKSPACE: "true"
        VITE_SIH_EXECUTIVE_EMAIL: ${SIH_EXECUTIVE_EMAIL:?Set SIH_EXECUTIVE_EMAIL in .env}
        VITE_SIH_EXECUTIVE_PASSWORD: ${SIH_EXECUTIVE_PASSWORD:?Set SIH_EXECUTIVE_PASSWORD in .env}
        VITE_SIH_TECHNICAL_EMAIL: ${SIH_TECHNICAL_EMAIL:?Set SIH_TECHNICAL_EMAIL in .env}
        VITE_SIH_TECHNICAL_PASSWORD: ${SIH_TECHNICAL_PASSWORD:?Set SIH_TECHNICAL_PASSWORD in .env}
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.workers.main"]
    volumes: ["./data:/app/data"]
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DB_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-3}
      - INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in .env}
      - ALLOW_INSECURE_CONNECTOR_HTTP=${ALLOW_INSECURE_CONNECTOR_HTTP:-false}
      - CRISPR_DATA_MODE=${CRISPR_DATA_MODE:-live}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-1}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-1}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - crispr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - crispr_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  bug-bounty:
    build:
      context: ./bug-bounty
      args:
        VITE_API_URL: ""
    ports: ["3000:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  crispr_postgres_data:
  crispr_neo4j_data:
